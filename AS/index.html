<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AS</title>
<style>
/* ---------------------------------------------------------------------------
   Tokens. Neutrals are tinted warm so the app sits beside a dark game at night
   without reading as cold-blue "tool chrome". The only chroma in the interface
   comes from each account's real competitive tier colour, served by Riot.
   --------------------------------------------------------------------------- */
:root {
  --bg:          oklch(0.16 0.008 40);
  --surface:     oklch(0.205 0.008 40);
  --surface-hi:  oklch(0.235 0.009 40);
  --line:        oklch(0.28 0.010 40);
  --line-soft:   oklch(0.235 0.009 40);
  --text:        oklch(0.95 0.004 70);
  --muted:       oklch(0.71 0.010 50);
  --faint:       oklch(0.55 0.010 50);
  --accent:      oklch(0.62 0.185 25);
  --accent-hi:   oklch(0.68 0.195 25);

  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --fast: 160ms;
  --slow: 240ms;

  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", ui-monospace, Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { color-scheme: dark; }

body {
  background: var(--bg);
  color: var(--text);
  font: 400 15px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  overflow-x: hidden;
}

/* Keyboard focus stays visible everywhere; pointer focus never draws a ring. */
:focus-visible {
  outline: 2px solid var(--accent-hi);
  outline-offset: 2px;
  border-radius: 4px;
}

/* --- Buttons ------------------------------------------------------------- */

button {
  font: 500 13px/1 var(--font);
  color: var(--text);
  background: none;
  border: 1px solid transparent;
  border-radius: 7px;
  padding: 8px 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
  transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease),
              color var(--fast) var(--ease), opacity var(--fast) var(--ease);
}
button svg { width: 15px; height: 15px; flex: none; }

.btn-ghost { color: var(--muted); border-color: var(--line); }
.btn-ghost:hover:not(:disabled) { color: var(--text); background: var(--surface-hi); border-color: oklch(0.34 0.012 40); }

.btn-solid { background: var(--accent); border-color: var(--accent); color: oklch(0.99 0.01 40); }
.btn-solid:hover:not(:disabled) { background: var(--accent-hi); border-color: var(--accent-hi); }

.btn-quiet { color: var(--faint); padding: 8px 10px; }
.btn-quiet:hover:not(:disabled) { color: var(--text); background: var(--surface-hi); }
.btn-quiet.danger:hover:not(:disabled) { color: var(--accent-hi); }

button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: 0.38; cursor: default; }

/* --- Header -------------------------------------------------------------- */

header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 28px;
  border-bottom: 1px solid var(--line-soft);
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
}

.wordmark {
  font: 600 13px/1 var(--font);
  letter-spacing: 0.22em;
  text-transform: uppercase;
}
.wordmark b { color: var(--accent); font-weight: 600; }

.count {
  font: 400 12px/1 var(--mono);
  color: var(--faint);
  padding-left: 12px;
  margin-left: 2px;
  border-left: 1px solid var(--line);
  flex: 1;
}

/* --- Status banner ------------------------------------------------------- */

#status {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 11px 28px;
  font-size: 13px;
  color: var(--muted);
  border-bottom: 1px solid var(--line-soft);
  background: var(--surface);
}
#status:empty { display: none; }
#status.is-error { color: oklch(0.80 0.10 25); }
#status .dot {
  width: 6px; height: 6px; border-radius: 50%; flex: none;
  background: currentColor;
  animation: pulse 1.6s var(--ease) infinite;
}
#status.is-error .dot { animation: none; }
@keyframes pulse { 50% { opacity: 0.25; } }

/* --- Roster -------------------------------------------------------------- */

main { padding: 4px 0 40px; }

.row {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr) auto;
  align-items: center;
  gap: 16px;
  padding: 15px 28px;
  border-bottom: 1px solid var(--line-soft);
  transition: background var(--fast) var(--ease);
}
.row:hover, .row:focus-within { background: var(--surface); }

/* Rank badge. The tier colour bleeds behind the icon rather than sitting on a
   border, so it reads as the account's identity, not as UI decoration. */
.badge {
  position: relative;
  width: 46px; height: 46px;
  display: grid;
  place-items: center;
}
.badge::before {
  content: "";
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, var(--tier, transparent) 0%, transparent 68%);
  opacity: 0.30;
}
.badge img { position: relative; width: 46px; height: 46px; object-fit: contain; }
.badge .unranked {
  position: relative;
  width: 30px; height: 30px;
  border: 1px solid var(--line);
  border-radius: 50%;
}

.identity { min-width: 0; }

.handle {
  font: 600 15px/1.35 var(--font);
  display: flex;
  align-items: baseline;
  gap: 1px;
  min-width: 0;
}
.handle .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.handle .tag { color: var(--faint); font-weight: 400; font-size: 14px; }

.meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 2px;
  font-size: 13px;
  color: var(--muted);
}
.meta .tier { color: var(--tier, var(--muted)); font-weight: 500; }
.meta .rr { font-family: var(--mono); font-size: 12px; color: var(--faint); }
.meta .sep { color: oklch(0.38 0.01 40); }
.meta .region { font-family: var(--mono); font-size: 12px; color: var(--faint); text-transform: uppercase; }

.live {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font: 500 10px/1 var(--font);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: oklch(0.78 0.13 150);
}
.live::before {
  content: "";
  width: 5px; height: 5px; border-radius: 50%;
  background: currentColor;
}

/* Actions stay mounted for screen readers and keyboard users; only their
   opacity is animated, so nothing reflows on hover. */
.actions {
  display: flex;
  align-items: center;
  gap: 2px;
  opacity: 0;
  transition: opacity var(--fast) var(--ease);
}
.row:hover .actions,
.row:focus-within .actions,
.actions.is-open { opacity: 1; }

.confirm {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
}

/* --- Loading / empty ----------------------------------------------------- */

.skeleton { pointer-events: none; }
.skeleton .bar {
  border-radius: 5px;
  background: linear-gradient(90deg, var(--surface) 0%, var(--surface-hi) 50%, var(--surface) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.4s linear infinite;
}
.skeleton .badge .bar { width: 46px; height: 46px; border-radius: 50%; }
.skeleton .l1 { width: 152px; height: 13px; }
.skeleton .l2 { width: 92px;  height: 11px; margin-top: 7px; }
@keyframes shimmer { to { background-position: -200% 0; } }

.empty {
  padding: 76px 28px;
  max-width: 46ch;
  margin: 0 auto;
  text-align: left;
}
.empty h2 { font: 600 17px/1.4 var(--font); margin-bottom: 8px; }
.empty p { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
.empty ol { list-style: none; counter-reset: step; display: grid; gap: 11px; }
.empty li {
  counter-increment: step;
  display: grid;
  grid-template-columns: 22px 1fr;
  gap: 12px;
  font-size: 14px;
  color: var(--muted);
}
.empty li::before {
  content: counter(step);
  font: 500 11px/22px var(--mono);
  color: var(--faint);
  text-align: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  height: 22px;
}

/* --- Motion preferences -------------------------------------------------- */

@keyframes arrive { from { opacity: 0; transform: translateY(6px); } }
.row.enter { animation: arrive var(--slow) var(--ease) backwards; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; }
  button:active:not(:disabled) { transform: none; }
}
</style>
</head>
<body>

<header>
  <span class="wordmark">A<b>S</b></span>
  <span class="count" id="count"></span>
  <button class="btn-ghost" id="refreshAll">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 11a8 8 0 1 0-.6 4M20 4v7h-7"/>
    </svg>
    Refresh
  </button>
  <button class="btn-solid" id="add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
      <path d="M12 5v14M5 12h14"/>
    </svg>
    Add signed-in account
  </button>
</header>

<div id="status" role="status" aria-live="polite"></div>

<main id="roster"></main>

<script>
const roster = document.getElementById('roster');
const statusEl = document.getElementById('status');
const countEl = document.getElementById('count');

let tiers = {};
let activePuuid = '';

const TIER_NAMES = [
  'Unranked', '', '',
  'Iron 1', 'Iron 2', 'Iron 3',
  'Bronze 1', 'Bronze 2', 'Bronze 3',
  'Silver 1', 'Silver 2', 'Silver 3',
  'Gold 1', 'Gold 2', 'Gold 3',
  'Platinum 1', 'Platinum 2', 'Platinum 3',
  'Diamond 1', 'Diamond 2', 'Diamond 3',
  'Ascendant 1', 'Ascendant 2', 'Ascendant 3',
  'Immortal 1', 'Immortal 2', 'Immortal 3',
  'Radiant',
];

const ICONS = {
  play: 'M8 5.5v13l11-6.5z',
  refresh: 'M20 11a8 8 0 1 0-.6 4M20 4v7h-7',
  stats: 'M14 4h6v6M20 4l-8.5 8.5M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4',
  remove: 'M5 7h14M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2',
};

function icon(name, filled) {
  return `<svg viewBox="0 0 24 24" fill="${filled ? 'currentColor' : 'none'}" stroke="${filled ? 'none' : 'currentColor'}"
    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[name]}"/></svg>`;
}

function say(message, isError) {
  statusEl.textContent = '';
  statusEl.classList.toggle('is-error', !!isError);
  if (!message) return;

  const dot = document.createElement('span');
  dot.className = 'dot';
  statusEl.append(dot, document.createTextNode(message));
}

/** Locks the interface for the duration of an action. Switching kills live game
    processes, so two of them must never overlap. */
async function busy(message, fn) {
  const buttons = [...document.querySelectorAll('button')];
  buttons.forEach((b) => (b.disabled = true));
  say(message);
  try {
    return await fn();
  } catch (e) {
    say(e.message, true);
  } finally {
    document.querySelectorAll('button').forEach((b) => (b.disabled = false));
  }
}

function row(account, index) {
  const tier = tiers[account.tier] || {};
  const el = document.createElement('div');
  el.className = 'row enter';
  el.style.animationDelay = `${Math.min(index, 6) * 25}ms`;
  if (tier.color) el.style.setProperty('--tier', tier.color);

  const isLive = account.puuid === activePuuid;

  el.innerHTML = `
    <div class="badge">${
      tier.icon ? `<img src="${tier.icon}" alt="">` : '<span class="unranked"></span>'
    }</div>
    <div class="identity">
      <div class="handle"><span class="name"></span><span class="tag"></span></div>
      <div class="meta">
        <span class="tier">${TIER_NAMES[account.tier] || 'Unranked'}</span>
        ${account.rr ? `<span class="sep">/</span><span class="rr">${account.rr} RR</span>` : ''}
        ${account.region ? `<span class="sep">/</span><span class="region">${account.region}</span>` : ''}
        ${isLive ? '<span class="sep">/</span><span class="live">Signed in</span>' : ''}
      </div>
    </div>
    <div class="actions">
      <button class="btn-quiet" data-act="refresh" aria-label="Refresh rank">${icon('refresh')}</button>
      <button class="btn-quiet" data-act="stats" aria-label="Open tracker.gg profile">${icon('stats')}</button>
      <button class="btn-quiet danger" data-act="remove" aria-label="Remove account">${icon('remove')}</button>
      <button class="btn-solid" data-act="play">${icon('play', true)}Play</button>
    </div>`;

  // textContent, never innerHTML: Riot handles carry arbitrary characters.
  el.querySelector('.name').textContent = account.name;
  el.querySelector('.tag').textContent = `#${account.tag}`;

  const actions = el.querySelector('.actions');

  el.querySelector('[data-act=play]').onclick = () =>
    busy(`Closing Riot and signing in as ${account.name}…`, async () => {
      await window.as.switchTo(account.puuid);
      activePuuid = account.puuid;
      say(`VALORANT is launching as ${account.name}#${account.tag}.`);
    });

  el.querySelector('[data-act=refresh]').onclick = () =>
    busy(`Refreshing ${account.name}…`, async () => {
      render(await window.as.refresh(account.puuid));
      say('');
    });

  el.querySelector('[data-act=stats]').onclick = () => window.as.tracker(account);

  // Inline confirm rather than a modal or a native dialog: the decision belongs
  // in the row it affects.
  el.querySelector('[data-act=remove]').onclick = () => {
    actions.classList.add('is-open');
    const prev = actions.innerHTML;
    actions.innerHTML = `
      <span class="confirm">Remove and delete its saved session?</span>
      <button class="btn-ghost" data-act="cancel">Keep</button>
      <button class="btn-solid" data-act="confirm">Remove</button>`;

    actions.querySelector('[data-act=cancel]').onclick = () => {
      actions.innerHTML = prev;
      actions.classList.remove('is-open');
      render(currentAccounts);
    };
    actions.querySelector('[data-act=confirm]').onclick = () =>
      busy('Removing…', async () => {
        render(await window.as.remove(account.puuid));
        say('');
      });
  };

  return el;
}

function skeleton() {
  const el = document.createElement('div');
  el.className = 'row skeleton';
  el.innerHTML =
    '<div class="badge"><div class="bar"></div></div>' +
    '<div><div class="bar l1"></div><div class="bar l2"></div></div><div></div>';
  return el;
}

function emptyState() {
  const el = document.createElement('div');
  el.className = 'empty';
  el.innerHTML = `
    <h2>No accounts saved yet</h2>
    <p>AS stores each Riot session locally, then swaps them before launching VALORANT.</p>
    <ol>
      <li>Open the Riot Client and sign in to the account you want to save.</li>
      <li>Come back here and press <strong>Add signed-in account</strong>.</li>
      <li>Repeat for every account. Switching afterwards takes one click.</li>
    </ol>`;
  return el;
}

let currentAccounts = [];

function render(accounts) {
  currentAccounts = accounts;
  roster.replaceChildren();
  countEl.textContent = accounts.length
    ? `${accounts.length} account${accounts.length > 1 ? 's' : ''}`
    : '';

  if (!accounts.length) {
    roster.append(emptyState());
    return;
  }
  accounts.forEach((a, i) => roster.append(row(a, i)));
}

document.getElementById('add').onclick = () =>
  busy('Reading the signed-in Riot Client session…', async () => {
    const accounts = await window.as.addCurrent();
    activePuuid = await window.as.active();
    render(accounts);
    say('');
  });

document.getElementById('refreshAll').onclick = () =>
  busy('Refreshing every account…', async () => {
    let accounts = await window.as.list();
    const failed = [];
    for (const a of accounts) {
      try {
        accounts = await window.as.refresh(a.puuid);
      } catch {
        failed.push(`${a.name}#${a.tag}`);
      }
    }
    render(accounts);
    say(failed.length ? `Session expired for ${failed.join(', ')}. Sign in again to renew.` : '', failed.length > 0);
  });

(async () => {
  roster.append(skeleton(), skeleton(), skeleton());
  try {
    const [meta, accounts, active] = await Promise.all([
      window.as.tierMeta(),
      window.as.list(),
      window.as.active(),
    ]);
    tiers = meta;
    activePuuid = active;
    render(accounts);
  } catch (e) {
    roster.replaceChildren();
    say(e.message, true);
  }
})();
</script>
</body>
</html>
