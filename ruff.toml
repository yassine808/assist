target-version = "py39"
line-length = 120
exclude = ["build", "release", "dist", "node_modules"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastAPI pattern)
    "B904",   # raise from in except
    "E741",   # ambiguous variable name
    "F841",   # local variable assigned but never used
    "UP007",  # use X | Y for union types
    "SIM105", # use contextlib.suppress
    "SIM108", # use ternary operator
    "SIM110", # use any/all instead of loop
    "SIM115", # use context manager for file open
    "B028",   # no explicit stacklevel in warn
]

[lint.per-file-ignores]
"src/backend/deceive/*.py" = ["E501", "B", "UP", "SIM"]
"src/backend/protocol.py" = ["E501"]
