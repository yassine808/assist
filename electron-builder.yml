appId: com.riotswitcher.app
productName: RiotSwitcher
copyright: Copyright © 2026 RiotSwitcher Contributors

publish:
  provider: github
  owner: yassine808
  repo: assist

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - build/icon.png

extraResources:
  - from: build/env.bin
    to: env.bin
  - from: release/python
    to: python
    filter:
      - "**/*"
  - from: official playercards/AgentMastery/Animated
    to: playercards/animated
    filter:
      - "*.webp"
      - "*.apng"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  executableName: RiotSwitcher

portable:
  artifactName: "${productName}-${version}-portable.exe"
  # Extract into the per-launch $PLUGINSDIR instead of one fixed %TEMP% folder.
  # With the default (a per-build KSUID folder) a second double-click reuses the
  # same folder: the new stub runs `RMDir /r $INSTDIR` and wipes the files of the
  # instance already running, whose window then goes blank (the renderer's
  # index.html is gone). A per-launch folder cannot touch another instance.
  #
  # Must be a truthy non-string: electron-builder 26 treats `false` as "unset"
  # and generates the KSUID anyway, despite what its option docs claim.
  unpackDirName: true

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RiotSwitcher
  runAfterFinish: true
  deleteAppDataOnUninstall: false

# Single instance is enforced in the main process (app.requestSingleInstanceLock);
# auto-launch on login is handled via registry at runtime/settings.
