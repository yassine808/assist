appId: com.riotswitcher.app
productName: RiotSwitcher
copyright: Copyright © 2026 RiotSwitcher Contributors

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

extraResources:
  - from: release/python
    to: python
    filter:
      - "**/*"

asarUnpack:
  - resources/python/**

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  executableName: RiotSwitcher

portable:
  artifactName: "${productName}-${version}-portable.exe"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RiotSwitcher
  runAfterFinish: true
  deleteAppDataOnUninstall: false

# Single instance is enforced in the main process (app.requestSingleInstanceLock);
# auto-launch on login is handled via registry at runtime/settings.
