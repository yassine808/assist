appId: com.riotswitcher.app
productName: RiotSwitcher
directories:
  output: release
files:
  - out/**/*
  - resources/**/*
  - "!src_godot/**"
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
