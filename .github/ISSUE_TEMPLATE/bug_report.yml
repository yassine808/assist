name: Bug report
description: Something in RiotSwitcher does not work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please check the
        [existing issues](https://github.com/yassine808/assist/issues?q=is%3Aissue)
        first so we do not track the same bug twice.
  - type: input
    id: version
    attributes:
      label: RiotSwitcher version
      description: Settings → Updates shows the installed version.
      placeholder: "3.1.4"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2 (22631)"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open RiotSwitcher
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: |
        Attach `%APPDATA%\riotswitcher\logs\main.log` if the app misbehaved.
        Remove anything you do not want to share.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am on the latest release.
          required: true
        - label: I searched the existing issues.
          required: true
