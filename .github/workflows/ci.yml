name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x

      - name: Build Assist + Assist.Shared
        run: dotnet build Assist/Assist.sln -c Release --nologo

  checks:
    name: Static checks
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x

      - name: Restore
        run: dotnet restore Assist/Assist.sln

      - name: Code formatting
        run: dotnet format Assist/Assist.sln --verify-no-changes --no-restore

      - name: Vulnerable package scan
        run: dotnet list Assist/Assist.sln package --vulnerable --include-transitive
