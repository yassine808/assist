name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same branch to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only ever needs to read the repo.
permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts is safe here: tsc never touches the Electron binary.
      # The `build` job performs a full install and verifies the binary exists,
      # which is what catches a broken Electron download.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Only high/critical block the build; moderate/low are reported but
      # non-blocking so routine upstream advisories do not wedge main.
      - run: npm audit --audit-level=high

  python:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install tooling
        # Quoted: the bare ":all:" contains a space-colon, which YAML reads as
        # a nested mapping and rejects.
        run: 'pip install --only-binary :all: ruff==0.5.0 pytest'
      - name: Ruff check
        run: ruff check src/backend/ tests/
      # compileall walks the tree, so a newly added module is covered without
      # anyone remembering to extend a hardcoded file list.
      - name: Syntax check all Python files
        run: python -m compileall -q src/backend tests
      - name: Pytest
        run: python -m pytest tests/ -q

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, audit, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Full install WITH lifecycle scripts: this is the only job that proves
      # Electron's postinstall actually fetched a runnable binary.
      - run: npm ci
      - name: Verify Electron binary was downloaded
        run: |
          node -e "
          const fs = require('fs');
          const bin = require('electron');
          if (!fs.existsSync(bin)) {
            console.error('Electron binary missing at ' + bin);
            process.exit(1);
          }
          console.log('Electron binary OK: ' + bin);
          "
      - name: Report Electron version
        run: node -p "'electron ' + require('electron/package.json').version"
      - run: npm run build
