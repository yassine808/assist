name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same branch to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only ever needs to read the repo.
permissions:
  contents: read

env:
  # Single source of truth for the Node version. Previously duplicated as a
  # literal across five jobs, which is how CI ended up on Node 20 while
  # jsdom@30 requires ^22.22.2 || ^24.15.0 || >=26 -- the Vitest job then died
  # in undici with "markAsUncloneable is not a function" on every test file.
  # Keep this in step with the `engines.node` floor in package.json.
  NODE_VERSION: "24"

jobs:
  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # --ignore-scripts is safe here: tsc never touches the Electron binary.
      # The `build` job performs a full install and verifies the binary exists,
      # which is what catches a broken Electron download.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check

  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    # Codecov's OIDC upload needs an id token; everything else stays read-only.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      - name: Upload coverage to Codecov
        # Without this upload the Codecov check stays queued forever: the app is
        # installed, but nothing ever sends it a report.
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: false

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Only high/critical block the build; moderate/low are reported but
      # non-blocking so routine upstream advisories do not wedge main.
      - run: npm audit --audit-level=high

  api-leak:
    name: API Key Leak Check
    runs-on: ubuntu-latest
    steps:
      # Full history so the scanner can catch a .env or sealed key that was
      # committed once and later deleted. The script prints file:line + rule,
      # never the secret itself.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run check:api-leaks

  python:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install tooling
        # Quoted: the bare ":all:" contains a space-colon, which YAML reads as
        # a nested mapping and rejects. Versions come from requirements-dev.txt
        # so a local run and this job cannot disagree about what "clean" means.
        # requirements.txt is required too, not optional: tests/test_regressions.py
        # imports main, which imports agent_database, which imports cryptography.
        # Until now no test imported the real backend, so CI never needed the
        # runtime deps and this went unnoticed.
        # --only-binary keeps this to prebuilt wheels, so no Rust or C
        # toolchain is needed on the runner. Both requirement files pin exact
        # versions; hashes are intentionally not used because they differ per
        # platform and would break local Windows installs.
        run: "pip install --only-binary :all: -r requirements.txt -r requirements-dev.txt" # NOSONAR
      - name: Ruff check
        run: ruff check src/backend/ tests/
      # compileall walks the tree, so a newly added module is covered without
      # anyone remembering to extend a hardcoded file list.
      - name: Syntax check all Python files
        run: python -m compileall -q src/backend tests
      - name: Pytest
        run: python -m pytest tests/ -q

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, prettier, test, audit, api-leak, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Full install WITH lifecycle scripts: this is the only job that proves
      # Electron's postinstall actually fetched a runnable binary. Keeping the
      # install scriptless and running Electron's installer directly makes that
      # step explicit instead of letting npm run every package's scripts.
      - run: npm ci --ignore-scripts
      - name: Download the Electron binary
        run: node node_modules/electron/install.js
      - name: Verify Electron binary was downloaded
        run: |
          node -e "
          const fs = require('fs');
          const bin = require('electron');
          if (!fs.existsSync(bin)) {
            console.error('Electron binary missing at ' + bin);
            process.exit(1);
          }
          console.log('Electron binary OK: ' + bin);
          "
      - name: Report Electron version
        run: node -p "'electron ' + require('electron/package.json').version"
      - run: npm run build
      - name: Verify the API key bridge is main-process only
        # The renderer is remote-content-capable and ships as readable JS. It
        # must never mention the env bridge or the inlined key shard; only the
        # main bundle may contain those symbols.
        run: |
          if grep -RIl -E 'HENRIKDEV_API_KEY|__RS_ENV_SHARD_A__|env-shard-a' out/renderer; then
            echo "::error::API key bridge leaked into the renderer bundle"
            exit 1
          fi
          echo "renderer bundle has no API key bridge references"
      - name: Verify the animated card catalogue
        # The picker and packaged installers depend on all 30 Agent Mastery
        # APNGs. Count the source assets so a partial checkout or accidental
        # deletion fails before it becomes a release with missing art.
        run: |
          cards=$(find "official playercards/AgentMastery/Animated" -maxdepth 1 -type f -name '*.apng' | wc -l)
          echo "animated cards: $cards"
          test "$cards" -eq 30
